# The M03 lift call (milestones/M03/README.md, "Close (PR 4)"; Unsure 28).
#
# Makes the call to the deployed agent that produces each answer the
# public API serves: signs in to label-impact's identity pool as the
# caller `pharmadelta`, asks the agent each served question through its
# door, and writes the call record and the door's reading as the artifact
# `m03-lift-<sha>` (call.json). It commits nothing: the pages are rebuilt
# from that artifact by hand with `uv run python -m src.m03.lift write`
# and committed in the pull request, which names this run. Only what this
# workflow writes is a record (SPEC/00 P4); a local call is not.
#
# Reads the same four names as m03.yml, from the gate step's env only:
# the secret M03_DOOR_PASSWORD and the variables M03_DOOR_URL,
# M03_DOOR_POOL_ID and M03_DOOR_CALLERS_CLIENT_ID. Writes none of them:
# the record carries the SHA-256 of the door URL's host, never the host
# (Unsure 12). Never SigV4, never the runtime's ARN, never the door
# client's secret. `permissions` stays `contents: read`: no workflow of
# this repository writes to a branch.
#
# Runs by hand (workflow_dispatch), and once on a push that adds or edits
# this file on a branch other than main, because a dispatch needs the
# file on the default branch and the lift is made before it is there.
# gate.yml (M00), m01.yml (M01), m02.yml (M02) and m03.yml (the gate)
# are unchanged.

name: m03-lift

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/m03-lift.yml']

permissions:
  contents: read

jobs:
  m03-lift:
    name: M03 lift call
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install (locked, Python 3.14 from .python-version)
        run: uv sync --locked

      - name: Create the artifact directory
        run: mkdir -p "$RUNNER_TEMP/m03-lift"

      # call.json is written whenever the step ran: with `ok` false and why
      # when the environment, the sign-in or the door did not give a record.
      - name: Sign in as pharmadelta; ask the agent each served question through its door; write the call record
        env:
          M03_DOOR_PASSWORD: ${{ secrets.M03_DOOR_PASSWORD }}
          M03_DOOR_URL: ${{ vars.M03_DOOR_URL }}
          M03_DOOR_POOL_ID: ${{ vars.M03_DOOR_POOL_ID }}
          M03_DOOR_CALLERS_CLIENT_ID: ${{ vars.M03_DOOR_CALLERS_CLIENT_ID }}
        run: >
          uv run python -m src.m03.lift call
          --out-dir "$RUNNER_TEMP/m03-lift"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Write the call record as a CI artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m03-lift-${{ github.sha }}
          path: ${{ runner.temp }}/m03-lift/
          if-no-files-found: error
          retention-days: 90
