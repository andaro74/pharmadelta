# The M01 reader (milestones/README.md row 1, F1.1).
#
# Reads label-impact's first pull request at its head, agentkeel's deploy
# runs and the registry, judges ledger row 1 as milestones/M01/README.md
# "Carried to PR 2" defines it, and writes the result as the artifact
# `m01-gate-<sha>`. The job fails when the verdict is not GREEN. Only what
# this workflow writes is evidence (SPEC/00 P4); a local run of the same
# command is not.
#
# What it reads, and with what: GitHub's REST API for two public
# repositories, agentkeel-studio/label-impact and andaro74/agentkeel, with
# the secret M01_READ_TOKEN when it is set, else this repository's
# GITHUB_TOKEN. M01_READ_TOKEN is a fine-grained personal access token of
# the owner, Metadata read on agentkeel-studio/label-impact only, set
# 2026-10-12 so that a seat's collaborator permission can be read (M01
# Unsure 10; milestones/M01/rulings/seat-read.md). GITHUB_TOKEN cannot
# read it, and a pull request from a fork gets no secret, so that run
# records the permission as unread, as before. The registry is in AWS and
# is recorded as unread (Unsure 12). The M00 gate (gate.yml) is unchanged.

name: m01

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m01-gate:
    name: M01 gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install (locked, Python 3.14 from .python-version)
        run: uv sync --locked

      # The artifact directory exists before anything can crash, so the
      # upload below always has a directory to read (M00 PR 3, Q3 b).
      - name: Create the artifact directory
        run: mkdir -p "$RUNNER_TEMP/m01-gate"

      # The reader writes result.json whenever its `main` runs: UNSCORABLE with
      # the error when a reading it needs cannot be made, never RED or GREEN.
      # A failure before `main` (an import error) exits 1 with no file, and the
      # upload below then fails on if-no-files-found (M01 Unsure 19, 22).
      - name: Read label-impact's first pull request, agentkeel's deploys and the registry; judge row 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          M01_READ_TOKEN: ${{ secrets.M01_READ_TOKEN }}
        run: >
          uv run python -m src.m01.reader
          --out "$RUNNER_TEMP/m01-gate/result.json"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Write the result as a CI artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m01-gate-${{ github.sha }}
          path: ${{ runner.temp }}/m01-gate/
          if-no-files-found: error
          retention-days: 90
